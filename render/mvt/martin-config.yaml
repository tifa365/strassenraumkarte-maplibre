# Martin MVT tile server config for the MapLibre port (Phase 1 layer set).
# Regenerate/extend the auto-detectable entries with:
#   martin --save-config - <connection-string>
# (see data/db_config.sh for connection defaults). auto_publish is
# deliberately off -- only tables actually used by web/style.json are
# listed here, not the whole schema. road_marking_polygon, label_highway,
# label_waterway, water_body_dissolved, building_parts_dissolved_height,
# building_lines are added by hand (geometry_type/srid) since their geom
# column has no fixed PostGIS type modifier and Martin's auto-detect
# skips those. NOTE: 'lanes' (raw centerlines) is deliberately NOT
# exposed -- verified against the real QGIS project that it is never
# directly rendered, only used as SQL input for highway_area/
# road_marking_*. The visible carriageway comes from highway_area
# (fills) + road_marking_* (lines/markings). water_body_dissolved (not
# water_body) and building_parts_dissolved_height (not building) are the
# tables the real QGIS style actually renders -- verified the same way.

listen_addresses: 127.0.0.1:3000
postgres:
  connection_string: postgres://postgres@localhost:5433/strassenraumkarte
  auto_publish: false
  tables:
    highway:
      schema: public
      table: highway
      srid: 3857
      geometry_column: geom
      geometry_type: LINESTRING
      id_column: segment_id
      properties:
        footway: text
        segregated: text
        class: text
        highway: text
        informal: text
        is_sidepath: text
        layer: int4
        tunnel: text
        type: text
        width: float4
        width_mapped: float4
    highway_hashes:
      schema: public
      table: highway_hashes
      srid: 3857
      geometry_column: geom
      geometry_type: POLYGON
